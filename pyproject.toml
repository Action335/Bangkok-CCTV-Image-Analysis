[project]
name = "bkk-cctv"
version = "0.1.0"
description = "Bangkok CCTV Image Analysis - 2110403 DSDE project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.3",
    "pandas",
    "pyarrow",
    "numpy",
    "pillow",
    "requests",
    "scikit-learn",
    "statsmodels",
    "prefect>=3",
    "streamlit",
    "pydeck",
    "plotly",
    "torch",
    "torchvision",
    "ultralytics",
    "jupyter",
    "matplotlib",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
